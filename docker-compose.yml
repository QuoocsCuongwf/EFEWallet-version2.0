services:
  auth-db:
    image: postgres:15
    container_name: auth-db
    environment:
      POSTGRES_DB: wallet_auth_db
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet123
    ports:
      - "5433:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet_auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  transaction-db:
    image: postgres:15-alpine
    container_name: transaction-db
    environment:
      POSTGRES_DB: wallet_transaction_db
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet123
    ports:
      - "5434:5432"
    volumes:
      - transaction_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet_transaction_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  wallet-db:
    image: postgres:15-alpine
    container_name: wallet-db
    environment:
      POSTGRES_DB: wallet_service_db
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet123
    ports:
      - "5435:5432"
    volumes:
      - wallet_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet_service_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  wallet-redis:
    image: redis:7-alpine
    container_name: wallet-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  wallet-rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: wallet-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: wallet
      RABBITMQ_DEFAULT_PASS: wallet123
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./AuthService
    container_name: auth-service
    env_file:
      - ./AuthService/.env
    environment:
      DB_HOST: auth-db
      DB_PORT: 5432
      DB_NAME: wallet_auth_db
      DB_USERNAME: wallet
      DB_PASSWORD: wallet123
      JWT_SECRET: ${JWT_SECRET:QuoocsCuongwf_EFEWalletProject_AuthService_SecretKey_ChangeThisToAtLeast64BytesLong}
      SERVER_PORT: 8083
    ports:
      - "8083:8083"
    depends_on:
      auth-db:
        condition: service_healthy

  wallet-service:
    build:
      context: ./WalletService
    container_name: wallet-service
    env_file:
      - ./WalletService/.env
    environment:
      DB_URL: jdbc:postgresql://wallet-db:5432/wallet_service_db
      DB_USERNAME: wallet
      DB_PASSWORD: wallet123
      REDIS_HOST: wallet-redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: wallet-rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: wallet
      RABBITMQ_PASSWORD: wallet123
      RABBITMQ_VHOST: /
      JWT_SECRET: ${JWT_SECRET:QuoocsCuongwf_EFEWalletProject_AuthService_SecretKey_ChangeThisToAtLeast64BytesLong}
      JWT_EXPIRATION_MS: 3600000
      JPA_DDL_AUTO: update
      SERVER_PORT: 8084
    ports:
      - "8084:8084"
    depends_on:
      wallet-db:
        condition: service_healthy
      wallet-redis:
        condition: service_healthy
      wallet-rabbitmq:
        condition: service_healthy

  gateway-service:
    build:
      context: ./GatewayService
    container_name: gateway-service
    environment:
      SERVER_PORT: 8080
      AUTH_SERVICE_URL: http://auth-service:8083
      WALLET_SERVICE_URL: http://wallet-service:8084
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - wallet-service

volumes:
  auth_db_data:
  transaction_db_data:
  wallet_db_data:
