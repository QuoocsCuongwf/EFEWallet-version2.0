spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:wallet_auth_db}
spring.datasource.username=${DB_USERNAME:wallet}
spring.datasource.password=${DB_PASSWORD:wallet123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

jwt.secret=${JWT_SECRET:CI_EFEWallet_AuthService_JWT_Secret_Key_Must_Be_Long_Enough_123456789}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
