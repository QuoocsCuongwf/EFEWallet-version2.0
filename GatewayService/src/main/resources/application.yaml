server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**

            - id: wallet-service
              uri: ${WALLET_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/wallet/**

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
